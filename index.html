<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Unlisted by request: no search engine should index or follow this. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />

    <title>Job Radar</title>
    <meta
      name="description"
      content="Match your CV against real job openings worldwide, filter by country and recency, and check that your CV reads cleanly."
    />

    <meta name="theme-color" content="#04091A" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Job Radar" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />

    <link rel="icon" type="image/svg+xml" href="./icons/mark.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!--
      The job list is the entire point of the page, and it was not requested
      until index-*.js had downloaded, parsed and run: the first card appeared
      around 7s on throttled mobile against a page that finished painting at
      3.2s. Naming it here lets the browser start it immediately.
    -->
    <link rel="preload" href="./data/jobs.json" as="fetch" crossorigin />

  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Job Radar needs JavaScript, because it reads and matches your CV entirely inside your own
      browser rather than on a server.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
